<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 420px; height: 300px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #0b0e14; color: #e6e9ef;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      user-select: none;
    }
    .logo {
      width: 64px; height: 64px; border-radius: 16px;
      background: linear-gradient(135deg, #4d6bfe, #36c5f0);
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; font-weight: 700; color: #fff;
      margin-bottom: 20px;
      animation: pulse 1.6s ease-in-out infinite;
    }
    .title { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
    .hint { font-size: 12px; color: #8a93a6; }
    .bar {
      margin-top: 24px; width: 180px; height: 3px;
      background: #232a38; border-radius: 2px; overflow: hidden;
    }
    .bar::after {
      content: ""; display: block; height: 100%; width: 40%;
      background: linear-gradient(90deg, #4d6bfe, #36c5f0);
      border-radius: 2px;
      animation: slide 1.2s ease-in-out infinite;
    }
    @keyframes slide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: .85; }
    }
  </style>
</head>
<body>
  <div class="logo">DS</div>
  <div class="title">DeepSeek Harness</div>
  <div class="hint">正在启动本地服务,请稍候…</div>
  <div class="bar"></div>
</body>
</html>
