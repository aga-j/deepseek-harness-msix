name: Build Microsoft Store Package (MSIX)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-store:
    # MSIX 打包依赖 Windows SDK 的 makeappx.exe,必须在 Windows runner 上构建
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install app dependencies (electron, electron-builder)
        run: npm install --no-audit --no-fund

      - name: Prepare bundled resources (node.exe + dsh)
        run: npm run prepare:resources

      - name: Build AppX package for Microsoft Store
        # electron-builder 25 中商店打包 target 名为 appx(产出 .appx,可直接上传 Partner Center);
        # 商店提交无需签名:提交后微软会用自己的证书重签
        run: npx electron-builder --win appx --publish never
        env:
          CSC_LINK: ""
          CSC_KEY_PASSWORD: ""

      - name: Upload AppX store package artifact
        uses: actions/upload-artifact@v4
        with:
          name: appx-store-upload
          # .appx 直接上传 Partner Center
          path: |
            release/*.appx
            release/*.msix
          retention-days: 30
